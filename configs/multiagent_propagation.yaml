# Two-agent jailbreak propagation on Qwen2.5-7B (dense arm, BIPOLARMULTIAGENT4DAY.md Day 2).
# Receiver B = Qwen2.5-7B (defended); attacker A = Qwen2.5-7B-Instruct as a compromised peer
# (set attacker_model to a *different* model for a stronger, non-self attacker).
# ASR is scored by the HarmBench classifier inside the experiment (instrument of record); the
# keyword judge is used only for the degeneration (NONRESPONSE) share.
#
# NOTE (2026-08-05): the project's own finding is that multiplicative head amplification is
# SIGN-INVERTED and can make ASR WORSE; the clean bipolar result was ADDITIVE. So the recommended
# mode is additive_steering — the experiment fits sign-correct per-head directions on the fly (a
# harmful-vs-benign difference-of-means on an AdvBench slice DISJOINT from the attack goals), so no
# external vectors file is needed. Run BOTH modes and read the degeneration column: a condition
# whose ASR only drops alongside a degeneration jump is breaking the model, not defending it.
seed: 0
attacker_model: ""            # "" = use the receiver as a (weak) attacker persona; set a real peer model
model:
  name: Qwen/Qwen2.5-7B-Instruct
  dtype: auto
  device: auto
  attn_implementation: eager   # head hooks need eager
generation:
  max_new_tokens: 130
  n_trials: 8
  temperature: 0.7
  top_p: 0.9
intervention:
  mode: additive_steering      # additive_steering (sign-correct, recommended) | multiplicative (cautionary baseline)
  positions: last
  steering_alpha: 8.0          # additive step size; sweep this
  refusal_multiplier: 3.0      # used only by multiplicative mode
  ablate_compliance: true
  compliance_scale: 0.0
circuit:
  circuit_map_path: legacy_circuits/circuit_map_7B.json
  selection: top_k
  top_k_refusal: 11
  top_k_compliance: 5
data:
  limit: 20                    # number of attack goals (AdvBench slice starts at index 120, disjoint)
eval:
  bootstrap_samples: 10000
  confidence: 0.95
